<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./src/core/analytics/google-analytics.js"></script>
  <script src="./src/core/analytics/clarity.js"></script>
  <meta name="google-adsense-account" content="ca-pub-4002333396957263">
  <meta name="color-scheme" content="light">
  <meta name="description" content="image2 UI 风格案例库。">
  <title>image2 UI 风格案例库</title>
  <link rel="stylesheet" href="./src/core/app-shell/site-shell.css">
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const language = params.get("lang") || localStorage.getItem("image2-ui-language") || ((navigator.language || "").toLowerCase().startsWith("en") ? "en" : "zh");
      const isEnglish = language === "en";
      document.documentElement.lang = isEnglish ? "en" : "zh-CN";
      document.title = isEnglish ? "image2 UI Style Library" : "image2 UI 风格案例库";
      document.querySelector('meta[name="description"]').content = isEnglish ? "A visual style library of image2 UI cases." : "image2 UI 风格案例库。";
    })();
  </script>
  <link rel="stylesheet" href="./src/features/library/library.css">
  <link rel="stylesheet" href="./src/components/device-preview/device-preview.css">
  <link rel="stylesheet" href="./src/features/library/library-cards.css">
  <link rel="stylesheet" href="./src/core/app-shell/directory-page.css">
  <link rel="stylesheet" href="./src/features/library/library-detail.css">
  <script src="./src/core/app-shell/app-shell.js"></script>
  <script src="./src/core/adsense/adsense.js" defer></script>
  <script src="./src/core/analytics/analytics.config.js"></script>
  <script src="./src/core/analytics/analytics.js" defer></script>
  <script type="module" src="./src/features/library/library-runtime.js"></script>
  <script type="module" src="./src/components/device-preview/device-preview.js"></script>
  <script type="module" src="./src/features/library/library.js"></script>
  <link rel="stylesheet" href="./src/components/knowledge-nav/knowledge-nav.css">
  <script type="module" src="./src/components/knowledge-nav/knowledge-nav.js"></script>
</head>
<body class="library-page directory-page">
  <a class="skip-link" href="#caseWall">跳到案例墙</a>
  <image2-site-header data-site-header></image2-site-header>

  <main class="directory-page-main library-main">
    <image2-knowledge-nav></image2-knowledge-nav>

    <h1 class="visually-hidden" id="catalogTitle">案例库</h1>

    <div class="library-controls" id="libraryControls">
      <nav class="library-filters" id="categoryNav" aria-label="按场景筛选">
        <button class="library-filter is-active" type="button" data-filter="all" aria-pressed="true"><span>全部</span><b>18</b></button>
        <button class="library-filter" type="button" data-filter="culture" aria-pressed="false"><span>文化</span><b>1</b></button>
        <button class="library-filter" type="button" data-filter="commerce" aria-pressed="false"><span>电商</span><b>5</b></button>
        <button class="library-filter" type="button" data-filter="editorial" aria-pressed="false"><span>阅读</span><b>1</b></button>
        <button class="library-filter" type="button" data-filter="travel" aria-pressed="false" hidden><span>旅行</span><b>0</b></button>
        <button class="library-filter" type="button" data-filter="creative" aria-pressed="false"><span>工具</span><b>4</b></button>
        <button class="library-filter" type="button" data-filter="wellness" aria-pressed="false"><span>健康</span><b>7</b></button>
      </nav>
      <div class="library-controls-end">
        <p class="library-result" id="resultCount" role="status" aria-live="polite">18 个案例</p>
        <button class="library-clear" id="clearFilters" type="button" hidden>清除筛选</button>
        <label class="library-search" for="styleSearch">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="styleSearch" type="search" autocomplete="off" placeholder="搜索案例、场景或风格" aria-label="搜索案例、场景或风格">
          <kbd>/</kbd>
        </label>
      </div>
    </div>

    <section class="library-spotlight" id="caseSpotlight" aria-label="主展台"></section>

    <section class="library-wall" id="caseWall" tabindex="-1" aria-labelledby="wallTitle">
      <div class="library-wall-head">
        <div class="library-wall-title">
          <h2 id="wallTitle">案例墙</h2>
          <p id="wallHint">点击任意案例，查看设计细节与可点击 Demo。</p>
        </div>
      </div>
      <div class="library-grid" id="demoGallery" aria-live="polite"></div>
      <div class="library-empty" id="emptyState" hidden>
        <p>没有找到匹配的案例。</p>
        <button type="button" data-clear-filters>清除筛选</button>
      </div>
    </section>
  </main>

  <p class="project-toast" id="projectToast" role="status" aria-live="polite" hidden></p>

  <dialog class="preview-dialog" id="previewDialog" aria-labelledby="previewDialogTitle">
    <form method="dialog" class="dialog-close-form"><button class="dialog-close" type="submit" aria-label="关闭预览">&#215;</button></form>
    <div class="preview-dialog-content">
      <div class="preview-dialog-info">
        <header class="preview-dialog-header"><p id="previewDialogTitle">案例预览</p></header>
        <div class="preview-dialog-details" id="previewDialogDetails"></div>
        <footer class="preview-dialog-footer">
          <div class="preview-dialog-primary-actions"><button class="dialog-copy-button" id="previewDialogApply" type="button">用这个风格</button></div>
          <details class="preview-dialog-more-actions"><summary id="previewDialogMoreActionsSummary">更多操作</summary><div><button class="dialog-secondary-button" id="previewDialogCopy" type="button">复制图片与提示词配置</button><a id="previewDialogOpenLive" target="_blank" rel="noopener" hidden>新窗口打开可点击 Demo</a></div></details>
        </footer>
      </div>
      <div class="preview-media-stage" id="previewMediaStage">
        <div class="preview-mode-head"><span class="preview-mode-caption">预览方式</span><div class="preview-mode-switch" id="previewModeSwitch" aria-label="预览方式"></div></div>
        <figure class="phone-frame phone-frame--detail preview-media-frame" id="previewMediaFrame"><div class="phone-screen" id="previewPhoneScreen"><img class="phone-media" id="previewDialogImage" width="390" height="844" decoding="async" alt="" hidden><img class="phone-media preview-video-sequence" id="previewDialogSequence" width="390" height="844" decoding="async" alt="" hidden><div class="preview-image-navigation" id="previewImageNavigation" aria-live="polite" hidden><button class="preview-image-step preview-image-previous" id="previewImagePrevious" type="button" aria-label="上一张效果图" title="上一张效果图">&#8592;</button><p><strong id="previewImageLabel"></strong><span id="previewImageCount"></span></p><button class="preview-image-step preview-image-next" id="previewImageNext" type="button" aria-label="下一张效果图" title="下一张效果图">&#8594;</button></div><video class="phone-media" id="previewDialogVideo" width="390" height="844" autoplay muted loop playsinline preload="metadata" hidden></video><iframe class="phone-media" id="previewDialogDemo" width="390" height="844" title="可点击 demo 预览" loading="eager" hidden></iframe><div class="preview-media-status" id="previewMediaStatus" role="status" aria-live="polite" hidden><span id="previewMediaStatusText"></span><button id="previewMediaRetry" type="button" hidden>重试</button></div><span class="interaction-cursor preview-cursor" id="previewCursor" aria-hidden="true" hidden><i></i></span></div></figure>
        <div class="preview-screen-rail" id="previewScreenRail" aria-label="案例页面" hidden></div>
        <div class="preview-media-toolbar" aria-label="媒体控制"><button class="media-icon-button" id="previewVideoToggle" type="button" aria-label="暂停视频" title="暂停视频"><span aria-hidden="true">&#10074;&#10074;</span></button><input class="video-progress" id="previewVideoProgress" type="range" min="0" max="0" value="0" step="0.05" aria-label="视频进度"><output class="video-time" id="previewVideoTime" for="previewVideoProgress">0:00 / 0:00</output><button class="media-icon-button" id="previewExpand" type="button" aria-label="全屏查看" title="全屏查看"><span aria-hidden="true">&#9974;</span></button></div>
      </div>
    </div>
  </dialog>

  <footer class="site-footer" data-site-footer>
    <div class="site-footer-inner">
      <p><strong>ONDesign</strong><span>AI × UI design learning studio</span></p>
      <nav aria-label="页脚导航"><a href="./learn.html" data-i18n="footer.learn">学习路径</a><a href="./vocabulary.html" data-i18n="footer.vocabulary">UI 词典</a><a href="./library.html" data-i18n="footer.library">案例库</a><a href="https://github.com/zhu-guli326/image2_UI_skill" target="_blank" rel="noopener noreferrer">GitHub</a></nav>
      <small>© 2026 ONDesign. Content and examples are for learning purposes.</small>
    </div>
  </footer>
</body>
</html>
