name: Unify Site Shell Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-site-shell-once.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find feature shell overrides
        run: |
          grep -R -n -E '\.site-header|\.site-nav|\.site-brand|\.global-language-switch|\.site-footer|image2-site-header' src/features --include='*.css' || true
