name: Sync generated catalog index

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync cursor-free media fields on PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch origin "$HEAD_BRANCH:$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'catalog/index.js';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['./assets/cases/fashion-shopping-app/fashion-app-demo.mp4', './assets/cases/fashion-shopping-app/screen-only/demo.mp4'],
            ['./assets/cases/fashion-shopping-app/fashion-app-preview.gif', './assets/cases/fashion-shopping-app/screen-only/hero.png'],
            ['./assets/cases/fashion-shopping-app/library-preview-2x.png', './assets/cases/fashion-shopping-app/screen-only/hero.png'],
            ['./assets/cases/news-app/news-app-demo.mp4', './assets/cases/news-app/screen-only/demo.mp4'],
            ['./assets/cases/news-app/news-app-preview.gif', './assets/cases/news-app/screen-only/headlines.png'],
            ['./assets/cases/news-app/library-preview-generated-v2-standard.png', './assets/cases/news-app/screen-only/headlines.png'],
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) {
              if (!source.includes(to)) throw new Error(`Missing generated catalog media field: ${from}`);
              continue;
            }
            source = source.split(from).join(to);
          }
          fs.writeFileSync(file, source);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.js
          if git diff --cached --quiet; then
            echo "Catalog index media fields already match clean case sources."
            exit 0
          fi
          git commit -m "chore: sync clean static media into generated catalog"
          git push origin "HEAD:$HEAD_BRANCH"
