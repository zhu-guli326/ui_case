name: Sync generated catalog index

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild catalog index on PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch origin "$HEAD_BRANCH:$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          npm run build:catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.js
          if git diff --cached --quiet; then
            echo "Catalog index already matches case sources."
            exit 0
          fi
          git commit -m "chore: rebuild generated catalog index"
          git push origin "HEAD:$HEAD_BRANCH"
