name: Patch Home Callouts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-home-callouts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch home motion
        run: python .github/scripts/patch_home_callouts.py
      - name: Validate JavaScript
        run: node --check src/features/home/home.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/home.js
          git commit -m "feat: sequence design system callouts"
          git push origin HEAD:main
