name: Library Gallery QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "library.html"
      - "library.js"
      - "src/features/library/library.css"
      - "src/features/library/library-density-fixes.css"
      - "src/components/device-preview/**"
      - "scripts/audit_library_gallery_geometry.mjs"
      - "tests/library-card-size-contract.test.mjs"
      - ".github/workflows/library-gallery-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-gallery-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Library card geometry contract
        run: node --test tests/library-card-size-contract.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/library-gallery-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/library-gallery-server.log
          exit 1
      - name: Audit rendered Library card geometry
        run: node scripts/audit_library_gallery_geometry.mjs
