name: Fix three visual regressions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-three-visual-regressions.yml"
      - "scripts/repair_three_visual_regressions.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair visual regressions
        run: python scripts/repair_three_visual_regressions.py
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            demo/fufu-bakery/index.html \
            demo/fufu-bakery/styles.css \
            demo/fufu-bakery/visual-polish.css \
            demo/fithub/styles.css \
            demo/mimo-activities/index.html \
            demo/mimo-activities/styles.css \
            demo/mimo-activities/visual-polish.css \
            library-preview-config.mjs \
            library.js \
            tests/visual-regressions.test.mjs
          if git diff --cached --quiet; then
            echo "Nothing to repair"
            exit 0
          fi
          git commit -m "fix: resolve FuFu FitHub and Mimo visual regressions"
          git push origin main
