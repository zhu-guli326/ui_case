name: Capture live homepage

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live site
        run: sleep 70
      - name: Capture capability section
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-based browser found" >&2
            exit 1
          fi
          npm install --no-save playwright-core@1.55.0
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER,
              args: ['--no-sandbox']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
            await page.goto('https://www.ondesign.tech/learn.html?lang=en', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1500);
            const section = page.locator('#capabilities');
            await section.scrollIntoViewIfNeeded();
            await page.waitForTimeout(600);
            await section.screenshot({ path: 'ondesign-capabilities.png' });
            await browser.close();
          })();
          NODE
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ondesign-capabilities-screenshot
          path: ondesign-capabilities.png
          if-no-files-found: error
