name: Rename knowledge base navigation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-knowledge-base-nav-once.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename navigation and refresh shared shell
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const shellPath = 'src/core/app-shell/app-shell.js';
          let shell = fs.readFileSync(shellPath, 'utf8');
          const oldCopy = '"nav.library": { zh: "导航栏", en: "Navigation" }';
          const newCopy = '"nav.library": { zh: "知识库", en: "Library" }';
          if (!shell.includes(oldCopy) && !shell.includes(newCopy)) {
            throw new Error('Could not find nav.library translation.');
          }
          shell = shell.replace(oldCopy, newCopy);
          fs.writeFileSync(shellPath, shell);

          const ignored = new Set(['.git', 'node_modules']);
          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk('.');

          const version = '20260830-global-nav-v4';
          let references = 0;
          let touched = 0;
          for (const file of htmlFiles) {
            const before = fs.readFileSync(file, 'utf8');
            if (!/app-shell\.js(?:\?v=[^"'\s<>]+)?/.test(before)) continue;
            references += 1;
            const after = before.replace(/app-shell\.js(?:\?v=[^"'\s<>]+)?/g, `app-shell.js?v=${version}`);
            if (after !== before) {
              fs.writeFileSync(file, after);
              touched += 1;
            }
          }
          if (!references) throw new Error('No shared app-shell references found.');
          console.log(`Shared shell references: ${references}; files updated: ${touched}`);
          NODE
          git diff --check

      - name: Commit global knowledge base navigation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(nav): rename global library menu to knowledge base"
          git pull --rebase origin main
          git push origin HEAD:main
