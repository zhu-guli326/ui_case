name: Canonical Cleanup Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge Skills patch into canonical stylesheet
        shell: bash
        run: |
          if [ -f src/features/skills/skills-compact-hero.css ]; then
            printf '\n\n/* Compact Skills hero — canonical current layout. */\n' >> src/features/skills/skills.css
            cat src/features/skills/skills-compact-hero.css >> src/features/skills/skills.css
            rm src/features/skills/skills-compact-hero.css
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('skills.html')
          s = p.read_text()
          s = s.replace('<link rel="stylesheet" href="./src/features/skills/skills-compact-hero.css?v=20260830-compact-v1">\n', '')
          s = s.replace('<link rel="stylesheet" href="./src/features/skills/skills-compact-hero.css">\n', '')
          p.write_text(s)

          p = Path('AGENTS.md')
          s = p.read_text()
          old = '- `vocabulary-component-data.js`, `vocabulary-search.mjs`, and `vocabulary-preview.js` are responsibility modules, not alternate versions.'
          new = '''- `vocabulary-i18n.js` owns Vocabulary page translations.\n- `vocabulary-navigation-data.js` owns navigation deep-dive data.\n- `vocabulary-card-config.js` owns card variants and media configuration.\n- `vocabulary-preview.js` owns preview orchestration; `vocabulary-preview-media.js` owns preview media configuration.\n- `vocabulary-component-data.js` and `vocabulary-search.mjs` are responsibility modules, not alternate versions.'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify canonical architecture
        run: |
          npm run build:catalog -- --check
          npm run check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: merge concurrent page patch into canonical source"
          git push origin HEAD:main
