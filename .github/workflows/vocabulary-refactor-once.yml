name: Vocabulary Refactor Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vocabulary-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Split Vocabulary data and remove bridges
        run: |
          node scripts/vocabulary_refactor_once.mjs
          node scripts/site_dead_ref_cleanup_once.mjs
          node --check src/features/vocabulary/vocabulary.js
          npm run build:catalog
          npm run build:catalog -- --check
          npm run check
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(vocabulary): split data and remove compatibility bridges"
          git pull --rebase origin main
          git push origin HEAD:main
