name: Update nav labels once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-nav-labels-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update bilingual navigation labels
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/core/app-shell/app-shell.js';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = new Map([
            ['"nav.library": { zh: "案例库", en: "Library" }', '"nav.library": { zh: "导航栏", en: "Navigation" }'],
            ['"nav.designSkills": { zh: "设计 Skill", en: "Design Skills" }', '"nav.designSkills": { zh: "设计精选", en: "Design Picks" }'],
            ['"nav.designSkillsHint": { zh: "查找可调用的设计能力", en: "Find reusable design capabilities" }', '"nav.designSkillsHint": { zh: "浏览精选设计资源", en: "Browse curated design resources" }'],
            ['"nav.skills": { zh: "设计 Skill", en: "Design skills" }', '"nav.skills": { zh: "设计精选", en: "Design Picks" }'],
          ]);

          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`Missing expected text: ${from}`);
            source = source.replace(from, to);
          }

          fs.writeFileSync(path, source);
          NODE

          git diff --check
      - name: Commit navigation copy update
        run: |
          if git diff --quiet; then
            echo "Navigation labels already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/app-shell/app-shell.js
          git commit -m "fix(nav): update bilingual navigation labels"
          git pull --rebase origin main
          git push origin HEAD:main
