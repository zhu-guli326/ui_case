name: Sync merged case catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-merged-case.yml"
      - "scripts/sync_case_index.mjs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync active case data
        run: node scripts/sync_case_index.mjs
      - name: Commit synchronized catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.js
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "chore: sync 22-case catalog after Aegean merge"
          git push origin main
