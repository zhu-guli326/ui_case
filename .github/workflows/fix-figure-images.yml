name: Fix homepage figure images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-figure-images.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Convert valid portrait JPGs to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/home/thinkers')
          dst = Path('assets/home/figures')
          dst.mkdir(parents=True, exist_ok=True)
          names = ['steve-jobs', 'leonardo-da-vinci', 'bill-gates', 'thomas-edison']
          for name in names:
              im = Image.open(src / f'{name}.jpg').convert('RGB')
              im.save(dst / f'{name}.webp', 'WEBP', quality=92, method=6)
          PY
      - name: Verify WebP headers and uniqueness
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('assets/home/figures').glob('*.webp'))
          hashes = []
          for p in files:
              data = p.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {p}'
              h = hashlib.sha256(data).hexdigest()
              hashes.append(h)
              print(p, len(data), h)
          assert len(hashes) == len(set(hashes)), 'Duplicate figure image content detected'
          PY
      - name: Commit fixed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home/figures/*.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage portrait image files'
          git push
