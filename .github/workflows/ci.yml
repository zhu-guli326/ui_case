name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Token audit
        run: npm run audit:tokens
      - name: Repository guard
        env:
          REPO_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run guard:repo
      - run: npm test
      - run: npm run check
