name: Patch Home Discovery Motion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-home-discovery-motion.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python .github/patch_home_discovery_motion.py

      - name: Validate
        run: npm run check && git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/home.js src/features/home/home.css learn.html
          git commit -m "feat: add playful GSAP discovery card motion"
          git push origin HEAD:main
