name: Rebuild catalog once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild generated catalog
        run: npm run build:catalog
      - name: Commit generated catalog if changed
        run: |
          if git diff --quiet -- catalog/index.js; then
            echo "Catalog already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.js
          git commit -m "chore(catalog): rebuild generated index"
          git push origin HEAD:main
