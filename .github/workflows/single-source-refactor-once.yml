name: Single Source Refactor Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/single-source-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consolidate page versions
        run: |
          node scripts/single_source_refactor_once.mjs
          npm run build:catalog -- --check
          npm run check
          git diff --check
      - name: Commit canonical page structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: enforce single-source page implementations"
          git pull --rebase origin main
          git push origin HEAD:main
# retry after script syntax fix
