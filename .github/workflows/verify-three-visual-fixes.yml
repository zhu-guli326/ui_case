name: Verify three visual fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-three-visual-fixes.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/ui-case-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-case-server.log
          exit 1
      - name: Audit real Library dialogs
        run: npm run audit:library-preview
      - name: Upload Library screenshots
        uses: actions/upload-artifact@v4
        with:
          name: verify-three-visual-fixes
          path: artifacts/visual-qa/library-dialog
          if-no-files-found: error
          retention-days: 3
