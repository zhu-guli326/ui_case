name: Fix Home Callout CSS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-callout-css.yml

permissions:
  contents: write

jobs:
  fix-callout-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow GSAP to animate design system callouts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/home/home-system-explainer.css')
          text = path.read_text(encoding='utf-8')
          old = '''/* These four rule cards are core content. GSAP may try to set inline opacity /
 * visibility while scrubbing; !important here keeps the cards permanently
 * present and lets motion only affect the central canvas. */
#design-system-live .system-callout,
#design-system-live .system-callout-type,
#design-system-live .system-callout-color,
#design-system-live .system-callout-spacing,
#design-system-live .system-callout-states {
  z-index: 4;
  opacity: 1 !important;
  visibility: visible !important;
  filter: none !important;
  pointer-events: none;
  transform: none !important;
  transition: box-shadow .45s ease !important;
}'''
          new = '''/* These four rule cards are core content and remain visible in the static fallback.
 * Desktop GSAP may temporarily set inline opacity / transform during the one-shot
 * entrance sequence, so do not lock those properties with !important here. */
#design-system-live .system-callout,
#design-system-live .system-callout-type,
#design-system-live .system-callout-color,
#design-system-live .system-callout-spacing,
#design-system-live .system-callout-states {
  z-index: 4;
  opacity: 1;
  visibility: visible;
  filter: none;
  pointer-events: none;
  transform: none;
  transition: box-shadow .45s ease;
}'''

          if old not in text:
              raise SystemExit('Expected callout rule was not found; refusing to patch.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/home-system-explainer.css
          git commit -m "fix: allow GSAP callout entrance motion"
          git push origin HEAD:main

# one-off trigger
