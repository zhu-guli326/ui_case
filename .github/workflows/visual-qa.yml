name: Visual QA

on:
  push:
    branches: [fix/visual-qa]
    paths:
      - "catalog/cases/**"
      - "demo/**"
      - "library*.js"
      - "library*.css"
      - "scripts/audit_demo_visual_contract.mjs"
      - "package.json"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/ui-case-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-case-server.log
          exit 1
      - name: Run visual QA
        id: audit
        continue-on-error: true
        run: npm run audit:visual
      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14
      - name: Enforce visual QA
        if: steps.audit.outcome != 'success'
        run: exit 1
