name: Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "catalog/cases/**"
      - "demo/**"
      - "src/**"
      - "launcher.html"
      - "library.html"
      - "library*.js"
      - "library*.css"
      - "library-preview-config.mjs"
      - "scripts/audit_launcher_runtime.mjs"
      - "scripts/audit_demo_visual_contract.mjs"
      - "scripts/audit_library_preview_contract.mjs"
      - "scripts/render_visual_qa_report.mjs"
      - "scripts/capture_screen_only_previews.mjs"
      - "scripts/capture_static_screen_only_sources.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static tests
        run: npm test
      - name: Check site contracts
        run: npm run check
      - name: Ensure video probe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/ui-case-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-case-server.log
          exit 1
      - name: Audit launcher runtime
        run: node scripts/audit_launcher_runtime.mjs
      - name: Capture legacy static sources as screen-only assets
        run: node scripts/capture_static_screen_only_sources.mjs
      - name: Run visual QA
        id: audit
        continue-on-error: true
        run: npm run audit:visual
      - name: Audit real Library preview dialogs
        id: library-audit
        continue-on-error: true
        run: npm run audit:library-preview
      - name: Capture screen-only effect states
        run: node scripts/capture_screen_only_previews.mjs
      - name: Render visual QA markdown
        if: always()
        continue-on-error: true
        run: node scripts/render_visual_qa_report.mjs
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14
      - name: Fail on visual contract regression
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = 'artifacts/visual-qa/visual-qa.json';
          const libraryPath = 'artifacts/visual-qa/library-dialog/library-preview-contract.json';
          if (!fs.existsSync(reportPath)) {
            console.error('Visual QA did not produce visual-qa.json');
            process.exit(1);
          }
          if (!fs.existsSync(libraryPath)) {
            console.error('Library preview audit did not produce library-preview-contract.json');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const library = JSON.parse(fs.readFileSync(libraryPath, 'utf8'));
          console.log('Demo QA', report.summary);
          console.log('Library dialog QA', library.summary);
          if (report.summary.failed > 0 || library.summary.failed > 0) {
            console.error(`Visual failures remain: demos=${report.summary.failed}, library=${library.summary.failed}`);
            process.exit(1);
          }
          NODE
