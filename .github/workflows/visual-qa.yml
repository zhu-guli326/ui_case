name: Visual QA

on:
  push:
    branches: [fix/visual-qa]
    paths:
      - "catalog/cases/**"
      - "demo/**"
      - "library*.js"
      - "library*.css"
      - "library-preview-config.mjs"
      - "scripts/audit_demo_visual_contract.mjs"
      - "scripts/audit_library_preview_contract.mjs"
      - "scripts/render_visual_qa_report.mjs"
      - "scripts/capture_screen_only_previews.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static tests
        run: npm test
      - name: Check site contracts
        run: npm run check
      - name: Ensure video probe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/ui-case-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-case-server.log
          exit 1
      - name: Run visual QA
        id: audit
        continue-on-error: true
        run: npm run audit:visual
      - name: Audit real Library preview dialogs
        id: library-audit
        continue-on-error: true
        run: npm run audit:library-preview
      - name: Capture screen-only effect states
        run: node scripts/capture_screen_only_previews.mjs
      - name: Render visual QA markdown
        if: always()
        continue-on-error: true
        run: node scripts/render_visual_qa_report.mjs
      - name: Sync every live first state to its canonical card preview
        if: always() && steps.audit.outcome != 'skipped' && github.actor != 'github-actions[bot]'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const reportPath = 'artifacts/visual-qa/visual-qa.json';
          if (!fs.existsSync(reportPath)) throw new Error(`Missing visual QA report: ${reportPath}`);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const records = fs.readdirSync('catalog/cases')
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => JSON.parse(fs.readFileSync(path.join('catalog/cases', name), 'utf8')));
          const live = records.filter((item) => item.liveDemo);
          if (live.length !== 20) throw new Error(`Expected 20 live cases, found ${live.length}`);

          const liveIds = new Set(live.map((item) => item.id));
          const blocked = report.cases.filter((item) => liveIds.has(item.id) && item.issues?.length);
          if (blocked.length) {
            console.error('Refusing to sync canonical previews for live cases with hard failures:', blocked.map((item) => item.id));
            process.exit(1);
          }

          const lines = [];
          for (const item of live) {
            const source = `artifacts/visual-qa/live/${item.id}.png`;
            if (!fs.existsSync(source)) throw new Error(`Missing rendered live state: ${source}`);
            const destination = item.liveDemo
              .replace(/^\.\//, '')
              .replace(/index\.html$/, 'screenshots/library-preview-2x.png');
            lines.push([item.id, source, destination].join('\t'));
          }
          fs.writeFileSync('/tmp/preview-targets.tsv', `${lines.join('\n')}\n`);
          NODE

          git pull --ff-only origin fix/visual-qa

          while IFS=$'\t' read -r case_id source destination; do
            mkdir -p "$(dirname "$destination")"
            echo "Syncing $case_id -> $destination"
            ffmpeg -loglevel error -y -i "$source" -vf scale=780:1688:flags=lanczos "$destination"
          done < /tmp/preview-targets.tsv

          # Organique exposes three stills in its image/video sequence. Keep them
          # screen-only so no historical baked phone shell can re-enter the UI.
          ffmpeg -loglevel error -y -i artifacts/visual-qa/screen-only/organique/01-choose.png -vf scale=780:1688:flags=lanczos demo/organique-food/screenshots/01-choose.png
          ffmpeg -loglevel error -y -i artifacts/visual-qa/screen-only/organique/02-plan.png -vf scale=780:1688:flags=lanczos demo/organique-food/screenshots/02-plan.png
          ffmpeg -loglevel error -y -i artifacts/visual-qa/screen-only/organique/03-confirmation.png -vf scale=780:1688:flags=lanczos demo/organique-food/screenshots/03-confirmation.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r _ _ destination; do
            git add -f "$destination"
          done < /tmp/preview-targets.tsv
          git add -f \
            demo/organique-food/screenshots/01-choose.png \
            demo/organique-food/screenshots/02-plan.png \
            demo/organique-food/screenshots/03-confirmation.png

          if git diff --cached --quiet; then
            echo "All live canonical previews already match their rendered first states."
            exit 0
          fi
          git commit -m "chore: sync all live canonical preview screenshots"
          git push origin HEAD:fix/visual-qa
      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14
      - name: Enforce structured visual QA result
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = 'artifacts/visual-qa/visual-qa.json';
          const libraryPath = 'artifacts/visual-qa/library-dialog/library-preview-contract.json';
          if (!fs.existsSync(reportPath)) {
            console.error('Visual QA did not produce visual-qa.json');
            process.exit(1);
          }
          if (!fs.existsSync(libraryPath)) {
            console.error('Library preview audit did not produce library-preview-contract.json');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const library = JSON.parse(fs.readFileSync(libraryPath, 'utf8'));
          console.log('Demo QA', report.summary);
          console.log('Library dialog QA', library.summary);
          if (report.summary.failed > 0 || library.summary.failed > 0) {
            console.error(`Visual failures remain: demos=${report.summary.failed}, library=${library.summary.failed}`);
            process.exit(1);
          }
          NODE
