name: Visual QA

on:
  push:
    branches: [fix/visual-qa]
    paths:
      - "catalog/cases/**"
      - "demo/**"
      - "library*.js"
      - "library*.css"
      - "scripts/audit_demo_visual_contract.mjs"
      - "scripts/render_visual_qa_report.mjs"
      - "package.json"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static tests
        run: npm test
      - name: Check site contracts
        run: npm run check
      - name: Install video probe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          IMAGE2_UI_PORT=4174 npm run serve > /tmp/ui-case-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/library.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-case-server.log
          exit 1
      - name: Run visual QA
        id: audit
        continue-on-error: true
        run: npm run audit:visual
      - name: Render visual QA markdown
        if: always()
        continue-on-error: true
        run: node scripts/render_visual_qa_report.mjs
      - name: Sync repaired live states to canonical card previews
        if: always() && github.actor != 'github-actions[bot]'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('artifacts/visual-qa/visual-qa.json', 'utf8'));
          const targets = new Set(['loy', 'journal']);
          const blocked = report.cases.filter((item) => targets.has(item.id) && item.issues?.length);
          if (blocked.length) {
            console.error('Refusing to sync previews for cases with hard failures:', blocked.map((item) => item.id));
            process.exit(1);
          }
          NODE
          ffmpeg -loglevel error -y -i artifacts/visual-qa/live/loy.png -vf scale=780:1688:flags=lanczos demo/loy-wellness/screenshots/library-preview-2x.png
          ffmpeg -loglevel error -y -i artifacts/visual-qa/live/journal.png -vf scale=780:1688:flags=lanczos demo/lumen-journal/screenshots/library-preview-2x.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/loy-wellness/screenshots/library-preview-2x.png demo/lumen-journal/screenshots/library-preview-2x.png
          if git diff --cached --quiet; then
            echo "Canonical previews already match the repaired live states."
            exit 0
          fi
          git commit -m "chore: sync repaired live preview screenshots"
          git push origin HEAD:fix/visual-qa
      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14
      - name: Enforce structured visual QA result
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = 'artifacts/visual-qa/visual-qa.json';
          if (!fs.existsSync(reportPath)) {
            console.error('Visual QA did not produce visual-qa.json');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          console.log(report.summary);
          if (report.summary.failed > 0) {
            console.error(`${report.summary.failed} case(s) still have hard visual failures.`);
            process.exit(1);
          }
          NODE
