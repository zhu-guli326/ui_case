name: Remove Launcher Cache Tag Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove manual cache tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('launcher.html')
          s = p.read_text()
          s = s.replace('?v=20260830-ds-static-v1', '')
          p.write_text(s)
          PY
          rm .github/workflows/remove-launcher-cache-once.yml
      - name: Verify and commit
        run: |
          npm run build:catalog -- --check
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove manual launcher cache versions"
          git pull --rebase origin main
          git push origin HEAD:main
