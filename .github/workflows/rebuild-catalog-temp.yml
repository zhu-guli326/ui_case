name: Rebuild Catalog Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-catalog-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild and verify catalog
        run: |
          git pull --rebase origin main
          npm run build:catalog
          npm run check
          git diff --check
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(catalog): refresh generated index"
          git pull --rebase origin main
          git push origin HEAD:main
