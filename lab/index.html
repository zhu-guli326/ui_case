<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="在固定页面蓝图中切换、比较设计系统并导出实现参考。">
  <title>设计系统实验室 · Image2 UI</title>
  <script>
    if (window.location.protocol === "file:") {
      window.location.replace(`http://127.0.0.1:4174/lab/${window.location.search}${window.location.hash}`);
    }
  </script>
  <link rel="stylesheet" href="../src/core/app-shell/language-switch.css?v=20260821-capsule-nav-v1">
  <link rel="stylesheet" href="../src/components/site-header/site-header.css?v=20260821-capsule-nav-v1">
  <link rel="stylesheet" href="./lab.css?v=20260813-device-ratio">
  <script src="../src/core/app-shell/app-shell.js?v=20260821-capsule-nav-v2"></script>
  <script type="module" src="./lab.js?v=20260813-device-ratio"></script>
</head>
<body data-site-page="brands.html">
  <a class="skip-link" href="#previewWorkspace">跳到页面预览</a>
  <image2-site-header data-site-header></image2-site-header>

  <nav class="mode-nav" aria-label="设计系统页面">
    <a href="../brands.html">系统目录</a>
    <a href="./" aria-current="page">预览实验室</a>
  </nav>

  <main class="lab-page">
    <header class="lab-commandbar">
      <div class="system-switcher">
        <span>设计系统</span>
        <div class="system-tabs" id="systemTabs" role="tablist" aria-label="切换设计系统"></div>
      </div>
      <fieldset class="view-switcher">
        <legend>视图</legend>
        <div class="segmented" data-control="view"></div>
      </fieldset>
      <button class="settings-button" id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsPanel" title="预览设置">
        <span class="settings-icon" aria-hidden="true"></span><span>设置</span>
      </button>
    </header>

    <div class="lab-layout">
      <section class="preview-workspace" id="previewWorkspace" tabindex="-1" aria-labelledby="workspaceHeading">
        <header class="workspace-heading">
          <div><h1 id="workspaceHeading">账户设置</h1><p id="workspaceDescription">资料编辑、偏好设置与保存反馈</p></div>
          <div class="workspace-status"><span id="systemStatus">官方 React API</span><span id="previewDimensions">1120 × 720</span></div>
        </header>
        <div class="preview-stage" id="previewStage" aria-live="polite"></div>
        <section class="matrix-drawer" id="componentMatrix" hidden aria-labelledby="matrixHeading"></section>
      </section>

      <aside class="inspector" aria-labelledby="inspectorHeading">
        <header class="inspector-heading"><h2 id="inspectorHeading">实现检查器</h2><span id="inspectorSystemName">Ant</span></header>
        <div class="inspector-tabs" role="tablist" aria-label="检查器视图">
          <button role="tab" aria-selected="true" data-inspector="mapping">映射</button>
          <button role="tab" aria-selected="false" data-inspector="tokens">Tokens</button>
          <button role="tab" aria-selected="false" data-inspector="guide">规范</button>
          <button role="tab" aria-selected="false" data-inspector="export">导出</button>
        </div>
        <div class="inspector-content" id="inspectorContent"></div>
      </aside>

      <aside class="settings-panel" id="settingsPanel" aria-labelledby="settingsHeading" hidden>
        <header><div><span>PREVIEW SETTINGS</span><h2 id="settingsHeading">预览设置</h2></div><button type="button" id="settingsClose" aria-label="关闭设置" title="关闭设置">×</button></header>
        <form id="settingsForm">
          <label><span>页面模板</span><select name="template"></select></label>
          <label><span>品牌主题</span><select name="theme"></select></label>
          <fieldset><legend>设备</legend><div class="device-options" data-control="device"></div></fieldset>
          <fieldset><legend>外观</legend><div class="segmented" data-control="appearance"></div></fieldset>
          <section class="theme-summary"><span>当前主题</span><strong id="activeThemeName"></strong><p id="activeThemeDescription"></p><div id="activeThemeSwatches" aria-label="主题色板"></div></section>
          <button class="reset-button" type="button" id="resetSettings">重置为默认设置</button>
        </form>
      </aside>
    </div>
  </main>
  <div class="settings-scrim" id="settingsScrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
