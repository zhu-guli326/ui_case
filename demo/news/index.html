<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Today · Interactive Demo</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e6dc}
    body{display:grid;place-items:center;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{position:relative;width:390px;height:844px;max-width:100vw;max-height:100vh;overflow:hidden;background:#f5f2e9}
    .screen{position:absolute;inset:0;opacity:0;transform:translateX(12px);transition:opacity .18s ease,transform .18s ease;pointer-events:none}
    .screen.is-active{opacity:1;transform:none;pointer-events:auto}
    .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;background:#f5f2e9}
    .demo-nav{position:absolute;z-index:8;left:50%;bottom:14px;display:flex;gap:4px;padding:4px;border:1px solid rgba(34,33,29,.13);border-radius:999px;background:rgba(247,244,235,.82);box-shadow:0 10px 30px rgba(39,37,31,.12);backdrop-filter:blur(16px);transform:translateX(-50%)}
    .demo-nav button{min-width:70px;height:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#747066;font-size:10px;font-weight:750;white-space:nowrap}
    .demo-nav button.is-active{background:#1c1c18;color:#fff}
    body[data-embed="1"] .app{width:100vw;height:100vh;max-width:none;max-height:none}
    body[data-embed="1"] .demo-nav{bottom:10px}
    @media (prefers-reduced-motion:reduce){.screen{transition:none}}
  </style>
</head>
<body>
  <main class="app" aria-label="Today news editorial demo">
    <section class="screen is-active" data-screen="headlines"><img src="../../assets/cases/news-app/headlines-screen.png" alt="Today 头条页"></section>
    <section class="screen" data-screen="feed"><img src="../../assets/cases/news-app/feed-screen.png" alt="Today 新闻流"></section>
    <section class="screen" data-screen="discover"><img src="../../assets/cases/news-app/discover-screen.png" alt="Today 发现页"></section>
    <nav class="demo-nav" aria-label="Today demo pages">
      <button class="is-active" type="button" data-next="headlines">头条</button>
      <button type="button" data-next="feed">新闻流</button>
      <button type="button" data-next="discover">发现</button>
    </nav>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    document.body.dataset.embed=params.get('embed')==='1'?'1':'0';
    const show=(id)=>{
      document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('is-active',el.dataset.screen===id));
      document.querySelectorAll('.demo-nav button').forEach(el=>el.classList.toggle('is-active',el.dataset.next===id));
    };
    document.addEventListener('click',e=>{const button=e.target.closest('[data-next]');if(button)show(button.dataset.next)});
  </script>
</body>
</html>
