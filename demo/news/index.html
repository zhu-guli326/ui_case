<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>News · Interactive Demo</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171714;background:#e8e6dc}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#e8e6dc}body{display:grid;place-items:center;overflow:hidden}
    .app{position:relative;width:min(100vw,390px);height:min(100vh,844px);min-height:620px;overflow:hidden;background:#f5f2e9;color:#171714}
    .status{display:flex;align-items:center;justify-content:space-between;height:38px;padding:10px 18px 0;font-size:11px;font-weight:700}.masthead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px 12px;border-bottom:1px solid rgba(27,27,22,.14)}.masthead button{border:0;background:transparent;font-size:15px}.masthead button:last-child{justify-self:end}.masthead strong{font:700 25px/1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
    .screen{position:absolute;inset:96px 0 66px;overflow:auto;padding:0 16px 24px;opacity:0;transform:translateX(16px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}.screen.is-active{opacity:1;transform:none;pointer-events:auto}.hero{position:relative;overflow:hidden;margin-top:14px;border-radius:18px;background:#ddd8cc}.hero img{display:block;width:100%;height:430px;object-fit:cover;object-position:top center}.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:55px 18px 18px;background:linear-gradient(transparent,rgba(20,20,17,.8));color:#fff}.hero-copy small{font-size:9px;letter-spacing:.15em;text-transform:uppercase}.hero-copy h1{margin:7px 0 0;font:600 31px/1.03 Georgia,"Times New Roman",serif}.hero-copy p{margin:8px 0 0;font-size:10px;line-height:1.5;opacity:.82}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 10px}.section-title h2{margin:0;font:600 21px/1.1 Georgia,"Times New Roman",serif}.section-title span{font-size:9px;color:#817e73}.list{display:grid;gap:9px}.story{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:10px;border:1px solid rgba(28,28,24,.12);border-radius:14px;background:#fbf9f2}.story img{width:112px;height:104px;object-fit:cover;object-position:top center;border-radius:10px}.story small{font-size:8px;color:#8a8679;letter-spacing:.1em}.story h3{margin:5px 0 0;font:600 16px/1.18 Georgia,"Times New Roman",serif}.story p{margin:6px 0 0;color:#767268;font-size:9px;line-height:1.45}
    .full-shot{margin-top:14px;overflow:hidden;border:1px solid rgba(28,28,24,.1);border-radius:18px;background:#fff}.full-shot img{display:block;width:100%;height:auto}
    .nav{position:absolute;z-index:5;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);height:66px;padding:7px 12px 9px;border-top:1px solid rgba(32,31,27,.12);background:rgba(245,242,233,.95);backdrop-filter:blur(16px)}.nav button{border:0;background:transparent;color:#8b877d;font-size:9px;font-weight:700}.nav button b{display:block;margin-bottom:3px;font-size:16px;font-weight:500}.nav button.is-active{color:#171714}
    body[data-embed="1"] .app{width:100vw;height:100vh;min-height:0}@media (prefers-reduced-motion:reduce){.screen{transition:none}}
  </style>
</head>
<body>
  <main class="app" aria-label="News editorial demo">
    <div class="status"><span>9:41</span><span>● ●●</span></div>
    <header class="masthead"><button type="button" aria-label="Menu">☰</button><strong>The Daily</strong><button type="button" aria-label="Search">⌕</button></header>
    <section class="screen is-active" data-screen="headlines">
      <article class="hero"><img src="../../assets/cases/news-app/headlines-screen.png" alt="头条页面"><div class="hero-copy"><small>Morning edition</small><h1>今天值得真正读完的三件事</h1><p>用报刊式层级组织重点，不靠信息堆叠制造“新闻感”。</p></div></article>
      <div class="section-title"><h2>Latest</h2><span>Updated now</span></div>
      <div class="list"><article class="story"><img src="../../assets/cases/news-app/feed-screen.png" alt="新闻流"><div><small>DESIGN</small><h3>界面密度如何影响阅读节奏</h3><p>更少的框线，更明确的标题层级。</p></div></article><article class="story"><img src="../../assets/cases/news-app/discover-screen.png" alt="发现页"><div><small>CULTURE</small><h3>本周值得保存的视觉线索</h3><p>从长篇阅读到轻量发现。</p></div></article></div>
    </section>
    <section class="screen" data-screen="feed"><div class="full-shot"><img src="../../assets/cases/news-app/feed-screen.png" alt="新闻流完整页面"></div></section>
    <section class="screen" data-screen="discover"><div class="full-shot"><img src="../../assets/cases/news-app/discover-screen.png" alt="发现页完整页面"></div></section>
    <nav class="nav" aria-label="Demo pages"><button class="is-active" data-next="headlines"><b>▤</b>头条</button><button data-next="feed"><b>≡</b>新闻流</button><button data-next="discover"><b>⌁</b>发现</button></nav>
  </main>
  <script>
    const params=new URLSearchParams(location.search);document.body.dataset.embed=params.get('embed')==='1'?'1':'0';
    const show=id=>{document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('is-active',el.dataset.screen===id));document.querySelectorAll('.nav button').forEach(el=>el.classList.toggle('is-active',el.dataset.next===id));};
    document.addEventListener('click',e=>{const b=e.target.closest('[data-next]');if(b)show(b.dataset.next)});
  </script>
</body>
</html>
