ion class="phone"><div class="s"><i class="is"></i><section class="v intro"><img src="assets/course-doodle.png"><h1>Learn,<br>grow,<br><span style="background:#fff;color:#000">achieve.</span></h1><button data-v="home">Get started</button></section><section class="v home hide"><div class="top">Diana Hess <button>⌕</button></div><h1>My courses</h1><div class="tabs"><button class="on">All</button><button>Advertising</button><button>Design</button></div><button class="course" data-v="detail">Design<b>UX as Art</b><p>Master user experience through a creative lens.</p></button><h2>My lessons</h2><button class="lesson" data-n="Creative Advertising">Creative Advertising: From Concept to Execution</button><button class="lesson" data-n="Brand Identity">Brand Identity: Logo, Typeface and Visual Style</button></section><section class="v detail hide"><button data-v="home">←</button><h1>UX as Art</h1><img src="assets/course-doodle.png" style="width:100%"><p>Build a personal visual system in small, practical lessons.</p><button class="start" data-v="home">Save lesson</button></section><nav><button data-v="home" class="on">●</button><button data-v="home">▦</button><button data-v="detail">♡</button></nav></div></section></main><script>const v=document.querySelectorAll('.v');const q=new URLSearchParams(location.search);if(q.has('embed')){document.documentElement.classList.add('embed');const f=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/390,innerHeight/693));f();addEventListener('resize',f)}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>v.forEach(x=>x.classList.toggle('hide',!x.classList.contains(b.dataset.v))))</script></body></html>
