        <text x="18" y="36" style="font-size:26px; font-weight:800; fill:#111214;">N</text>
        <text x="18" y="80" class="cardTitle">React Native</text>
        <text x="18" y="112" class="cardMeta">布局 · 动效 · 平台</text>
      </g>
