        <text x="18" y="36" style="font-size:26px; font-weight:800; fill:#111214;">Aa</text>
        <text x="18" y="80" class="cardTitle">写作</text>
        <text x="18" y="112" class="cardMeta">语气 · 结构 · 文档</text>
      </g>

