<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#d9d5cb" flood-opacity=".45"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#d8d4cc" flood-opacity=".25"/>
    </filter>
    <style>
      .ui { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .top { font-size: 26px; font-weight: 800; fill: #101113; letter-spacing: .01em; }
      .eyebrow { font-size: 20px; font-weight: 800; fill: #7f7f7f; }
      .headline { font-size: 108px; font-weight: 900; fill: #111214; letter-spacing: -.075em; }
      .body { font-size: 29px; font-weight: 500; fill: #5f646d; }
      .mono { font-size: 22px; font-weight: 500; fill: #eceff2; }
      .small { font-size: 17px; font-weight: 500; fill: #8a8f98; }
      .panelTitle { font-size: 54px; font-weight: 900; fill: #111214; letter-spacing: -.06em; }
      .panelLead { font-size: 21px; font-weight: 500; fill: #757a83; }
      .cardTitle { font-size: 23px; font-weight: 850; fill: #15171a; }
      .cardMeta { font-size: 15px; font-weight: 500; fill: #6f757f; }
      .footer { font-size: 18px; font-weight: 500; fill: #9aa0a8; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f7f5f1"/>
  <g opacity=".55">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600M0 800H1600M0 880H1600M0 960H1600M0 1040H1600M0 1120H1600" stroke="#ece8e2" stroke-width="1"/>
    <path d="M80 0V1200M160 0V1200M240 0V1200M320 0V1200M400 0V1200M480 0V1200M560 0V1200M640 0V1200M720 0V1200M800 0V1200M880 0V1200M960 0V1200M1040 0V1200M1120 0V1200M1200 0V1200M1280 0V1200M1360 0V1200M1440 0V1200M1520 0V1200" stroke="#ece8e2" stroke-width="1"/>
  </g>

  <g class="ui" filter="url(#shadow)">
    <rect x="53" y="52" width="1494" height="1100" rx="38" fill="#ffffff" stroke="#d8d4cb" stroke-width="2"/>
  </g>

  <g class="ui" transform="translate(76 72)">
    <path d="M12 0L30 30H0L12 0Z" fill="#111214"/>
    <text x="49" y="23" class="top">SUBHAN CODE</text>
    <text x="1512" y="22" class="eyebrow" text-anchor="end">MICRO TRANSITIONS</text>

    <g transform="translate(20 140)">
      <text x="0" y="94" class="headline">
        <tspan x="0" dy="0">AMICRO</tspan>
        <tspan x="0" dy="108">MOTION</tspan>
      </text>
      <text x="0" y="286" class="body">
        <tspan x="0" dy="0">A compact set of micro-interactions and transitions</tspan>
        <tspan x="0" dy="44">for calm, polished React interfaces.</tspan>
      </text>

      <g transform="translate(0 400)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="720" height="160" rx="28" fill="#111214"/>
        <circle cx="36" cy="34" r="7" fill="#6f7175"/>
        <circle cx="64" cy="34" r="7" fill="#6f7175"/>
        <circle cx="92" cy="34" r="7" fill="#6f7175"/>
        <text x="30" y="92" class="mono">npm install amicro</text>
        <text x="30" y="132" class="mono">motion + react + tiny transitions</text>
      </g>

      <g transform="translate(0 602)">
        <rect x="0" y="0" width="720" height="110" rx="24" fill="#faf8f5" stroke="#e4dfd5"/>
        <g transform="translate(28 28)">
          <rect x="0" y="0" width="140" height="48" rx="18" fill="#efefed"/>
          <text x="34" y="31" class="top" style="font-size: 22px; font-weight: 850; fill: #404040;">Review</text>
          <text x="160" y="32" style="font-size:30px; font-weight:700; fill:#9b9b9b;">→</text>
          <rect x="206" y="0" width="140" height="48" rx="18" fill="#efefed"/>
          <text x="244" y="31" class="top" style="font-size: 22px; font-weight: 850; fill: #404040;">Tune</text>
          <text x="366" y="32" style="font-size:30px; font-weight:700; fill:#9b9b9b;">→</text>
          <rect x="412" y="0" width="140" height="48" rx="18" fill="#111214"/>
          <text x="450" y="31" style="font-size:22px; font-weight:850; fill:#ffffff;">Ship</text>
        </g>
      </g>

      <g transform="translate(0 764)">
        <text x="0" y="24" class="small">micro motion | transitions | cards | hover states | route changes</text>
        <text x="0" y="58" class="small">Reusable interaction recipes for product UI</text>
      </g>

      <text x="0" y="930" class="footer">amicro / subhan-code</text>
    </g>
  </g>

  <g class="ui" transform="translate(878 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="598" height="900" rx="30" fill="#fcfbf8" stroke="#d8d4cb" stroke-width="2"/>
    <text x="30" y="40" class="eyebrow">能力矩阵</text>
    <text x="30" y="112" class="panelTitle">What the UI can do</text>
    <text x="30" y="146" class="panelLead">Small motion, clear feedback, no noise</text>

    <g transform="translate(30 192)">
      <g>
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Fade</text>
        <text x="18" y="112" class="cardMeta">soft entry / exit</text>
      </g>
      <g transform="translate(276 0)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Scale</text>
        <text x="18" y="112" class="cardMeta">pop / emphasis</text>
      </g>

      <g transform="translate(0 158)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Stagger</text>
        <text x="18" y="112" class="cardMeta">sequence / rhythm</text>
      </g>
      <g transform="translate(276 158)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Hover</text>
        <text x="18" y="112" class="cardMeta">preview / affordance</text>
      </g>

      <g transform="translate(0 316)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Route</text>
        <text x="18" y="112" class="cardMeta">page transition</text>
      </g>
      <g transform="translate(276 316)">
        <rect width="252" height="134" rx="20" fill="#111214"/>
        <text x="18" y="80" style="font-size:23px; font-weight:850; fill:#ffffff;">Card Layout</text>
        <text x="18" y="112" style="font-size:15px; font-weight:500; fill:#b8bcc2;">responsive / density</text>
      </g>

      <g transform="translate(0 474)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Motion</text>
        <text x="18" y="112" class="cardMeta">timing / easing</text>
      </g>
      <g transform="translate(276 474)">
        <rect width="252" height="134" rx="20" fill="#ffffff" stroke="#e0ddd7"/>
        <text x="18" y="80" class="cardTitle">Polish</text>
        <text x="18" y="112" class="cardMeta">subtle, production-ready</text>
      </g>
    </g>

    <g transform="translate(18 798)" filter="url(#cardShadow)">
      <rect width="542" height="66" rx="18" fill="#111214"/>
      <text x="22" y="41" class="mono" style="font-size:18px;">agent.use(skill)  →  smoother interfaces</text>
    </g>
  </g>
</svg>
