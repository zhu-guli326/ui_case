<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="组合页面类型、设计系统、品牌参考和视觉主题，实时比较并生成可编辑 UI Demo。">
  <title>设计实验室 · Image2 UI</title>
  <link rel="stylesheet" href="./brands.css?v=20260815-flow">
  <link rel="stylesheet" href="./i18n.css">
  <link rel="stylesheet" href="./site-nav.css?v=20260815-ondesign">
  <script src="./i18n.js?v=20260815-ondesign"></script>
  <script type="module" src="./brands.js?v=20260815-preview-fix"></script>
</head>
<body data-site-page="brands.html">
  <a class="skip-link" href="#previewStage">跳到实时预览</a>
  <image2-site-header data-site-header></image2-site-header>

  <main class="lab-shell">
    <header class="lab-intro">
      <div>
        <p class="eyebrow">DESIGN LAB / LIVE WORKSPACE</p>
        <h1>同一个页面，<br><em>看清每一种选择。</em></h1>
      </div>
      <div class="intro-copy">
        <p>设计系统决定组件和交互，品牌参考决定表达气质，视觉主题决定页面氛围。三者可以自由组合，不再混为一谈。</p>
        <div class="concept-legend" aria-label="概念说明">
          <button type="button" data-explain="system"><i>01</i><span><strong>设计系统</strong><small>组件 · 间距 · 状态</small></span></button>
          <button type="button" data-explain="brand"><i>02</i><span><strong>品牌参考</strong><small>气质 · 排版倾向</small></span></button>
          <button type="button" data-explain="theme"><i>03</i><span><strong>视觉主题</strong><small>色彩 · 表现氛围</small></span></button>
        </div>
      </div>
    </header>

    <section class="project-composer" aria-labelledby="composerTitle">
      <header>
        <div><p class="eyebrow">CURRENT DESIGN PROJECT</p><h2 id="composerTitle">配置当前设计项目</h2></div>
        <div class="project-name"><span>项目名称</span><input id="projectName" value="Atlas Dashboard" aria-label="项目名称"></div>
      </header>
      <div class="project-origin" id="projectOrigin"></div>
      <div class="selector-grid">
        <label><span><b>01</b> 页面类型</span><select id="templateSelect"></select><small>决定内容骨架与任务流程</small></label>
        <label><span><b>02</b> 设计系统</span><select id="systemSelect"></select><small id="systemHelp">决定组件、状态与交互规范</small></label>
        <label><span><b>03</b> 品牌参考</span><select id="brandSelect"></select><small>只参考品牌语言，不调用品牌组件</small></label>
        <label><span><b>04</b> 视觉主题</span><select id="themeSelect"></select><small>决定色彩、材质与页面氛围</small></label>
      </div>
      <div class="fine-controls">
        <fieldset><legend>可修改范围</legend><div class="intensity-options" id="intensityOptions"></div></fieldset>
        <fieldset><legend>设备</legend><div class="compact-options" id="deviceOptions"></div></fieldset>
        <fieldset><legend>外观</legend><div class="compact-options" id="appearanceOptions"></div></fieldset>
      </div>
      <p class="selection-sentence" id="selectionSentence" aria-live="polite"></p>
    </section>

    <section class="workspace" aria-labelledby="previewTitle">
      <header class="workspace-bar">
        <div><p class="eyebrow">LIVE PREVIEW</p><h2 id="previewTitle">实时页面</h2></div>
        <div class="view-controls" role="group" aria-label="预览模式">
          <button class="is-active" type="button" data-view="single">单页</button>
          <button type="button" data-view="compare">对比模式</button>
          <button type="button" data-view="differences">差异清单</button>
        </div>
        <div class="workspace-actions">
          <button class="secondary-action" id="saveProject" type="button">保存当前方案</button>
          <button class="primary-action" id="generateDemo" type="button">生成可点击 Demo <span>↗</span></button>
        </div>
      </header>

      <div class="compare-picker" id="comparePicker" hidden>
        <div><strong>选择 2–3 个系统并排比较</strong><span>页面内容保持不变，只突出规范差异</span></div>
        <div id="compareSystems"></div>
      </div>

      <div class="preview-stage" id="previewStage" tabindex="-1"></div>
      <div class="difference-panel" id="differencePanel" hidden></div>
    </section>

    <aside class="decision-panel" aria-labelledby="decisionTitle">
      <div>
        <p class="eyebrow">WHY IT CHANGED</p>
        <h2 id="decisionTitle">这次选择改变了什么</h2>
      </div>
      <dl id="differenceSummary"></dl>
      <div class="vocab-assist">
        <span>词汇辅助</span>
        <p>看到陌生概念时，直接悬停或点击查看解释，并可立即应用。</p>
        <div><button type="button" data-theme-quick="editorial-commerce" title="像杂志排版一样强调内容层级与留白">Editorial</button><button type="button" data-theme-quick="glass" title="用半透明表面与背景模糊建立层级">Glassmorphism</button><button type="button" data-theme-quick="neo-brutal" title="使用硬边框、强对比和直接表达">Neo Brutalism</button></div>
      </div>
    </aside>
  </main>

  <dialog class="explain-dialog" id="explainDialog">
    <form method="dialog"><button aria-label="关闭">×</button></form>
    <div id="explainContent"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
